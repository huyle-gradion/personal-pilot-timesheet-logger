# docs/orchestration/status.yaml
#
# WHAT BELONGS HERE: the machine-readable, per-item status the vault generator
# reads. One entry per slice, merge, or decision, with exactly these fields:
#
#   id        stable short identifier (e.g. COLLECT-REMOTE-1, MERGE-11)
#   kind      slice | merge | decision
#   state     planned | implemented | source-accepted | merged | blocked
#   commits   list of short SHAs (inline [a, b] or a block "- a" list)
#   pr        pull request number, or null
#   issues    list of issue numbers
#   date      YYYY-MM-DD
#   one_line  one sentence; quote it if it contains a colon
#
# WHAT STAYS IN docs/orchestration/state.md: everything else. The prose
# narrative, the reasoning and authority references, the review findings and
# their dispositions, the supersessions, and the honest limitations all live in
# the append-only ledger. This file does NOT restate the ledger; it carries only
# the status a table needs. When the two disagree, the ledger is the record and
# this file is corrected to match it.
#
# The generator validates kind, state and date, so a typo fails loudly rather
# than producing a plausible wrong row.

